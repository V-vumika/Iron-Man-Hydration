<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }

  body {
    font-family: 'Segoe UI', Roboto, sans-serif;
    -webkit-app-region: drag;
  }

  .settings-btn {
  position: absolute;
  top: 190px;
  left: 610px;
  width: 14px;
  height: 14px;

  display: flex !important;
  align-items: center;
  justify-content: center;

  border-radius: 50%;
   background: radial-gradient(
        circle,
        #ffffff 0%,
        #67f6ff 25%,
        #00d9ff 55%,
        #008cff 100%
    );

    border: 2px solid #7df9ff;

    box-shadow:
        0 0 6px #00eaff,
        0 0 14px #00d9ff,
        0 0 24px rgba(0, 180, 255, 0.8);


  cursor: pointer;
  z-index: 9999 !important;

  -webkit-app-region: no-drag;
  opacity: 1 !important;
  visibility: visible !important;
}

.settings-btn svg {
  width: 14px;
  height: 14px;
  display: block;
}

  /* WRAPPER — window (820x560) er sathe match */
  .widget-wrapper {
    position: fixed;
    inset: 0;
    overflow: visible;
  }

  /* IRON MAN */
  .hero-image {
    position: absolute;
    width: 440px;
    height: 540px;
    object-fit: contain;
    object-position: bottom right;
    right: 0;
    bottom: -30px;
    z-index: 3;
    -webkit-app-region: no-drag;
    pointer-events: none;
    filter: drop-shadow(0 0 18px rgba(255, 60, 0, 0.35));
    animation: hero-rise 1.8s cubic-bezier(.16, .84, .44, 1) both;
  }

  /* ---------- STARK HUD CARD (pure SVG + CSS) ---------- */
  .card {
    position: absolute;
    right: 250px;            /* image theke duratto */
    bottom: 190px;           /* haat er height */
    width: 300px;            /* height auto: aspect ratio thik thake */
    aspect-ratio: 883 / 701;
    z-index: 2;
    user-select: none;
    -webkit-app-region: no-drag;
    opacity: 0;
    animation: hud-in .4s cubic-bezier(.2, .8, .2, 1) 1.4s both;
  }

  .card-art {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
  }

  /* glow-wala shape gulo jekono background e thik dekhabe */
  .card [filter="url(#glow)"],
  .card [filter="url(#glowS)"],
  .card [filter="url(#glowXS)"] {
    mix-blend-mode: screen;
  }

  /* SVG er button gulor upor invisible click area */
  .hit {
    position: absolute;
    padding: 0;
    border: 0;
    border-radius: 3.5% / 14%;
    background: transparent;
    cursor: pointer;
    -webkit-app-region: no-drag;
    transition: background .12s ease, box-shadow .12s ease, transform .12s ease;
  }
  .hit:hover  { background: rgba(165, 243, 252, .14); box-shadow: 0 0 16px rgba(34, 211, 238, .7); }
  .hit:active { background: rgba(165, 243, 252, .28); transform: scale(.98); }
  .hit:focus-visible { outline: 2px solid #a5f3fc; outline-offset: 2px; }

  .hit-drank  { left: 18.0%; top: 64.8%; width: 30.8%; height: 12.1%; }
  .hit-snooze { left: 51.2%; top: 65.2%; width: 30.4%; height: 11.3%; }

  @keyframes hud-in {
    from { opacity: 0; transform: translateX(14px) scale(.96); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes hero-rise {
    from { transform: translateY(260px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .hero-image { animation: none; }
  }
</style>
</head>
