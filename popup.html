<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }

  body {
    font-family: 'Segoe UI', Roboto, sans-serif;
    -webkit-app-region: drag;
  }

  /* WRAPPER — window (820x560) er sathe match */
  .widget-wrapper {
    position: fixed;
    inset: 0;
    overflow: visible;
  }

  /* IRON MAN — aage 350x400 chhilo */
  .hero-image {
    position: absolute;
    width: 440px;
    height: 540px;
    object-fit: contain;
    object-position: bottom right;
    right: 0;
    bottom: -30px;
    z-index: 3;
    -webkit-app-region: no-drag;
    pointer-events: none;
    filter: drop-shadow(0 0 18px rgba(255, 60, 0, 0.35));
  }

  /* CARD — uthano haat er kachhe */
  .card {
    position: absolute;
    width: 290px;
    min-height: 200px;
    right: 270px;     /* image theke duratto */
    bottom: 250px;    /* haat er height */
    border-radius: 14px;
    padding: 14px 16px;
    background: linear-gradient(145deg, #1a1a1a 0%, #2b0000 100%);
    border: 1.5px solid #ffcc00;
    box-shadow:
      0 0 20px rgba(255, 0, 0, 0.35),
      0 0 4px rgba(255, 204, 0, 0.6) inset;
    color: #f5f5f5;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 2;
  }

  /* haat er dike pointer */
  .card::after {
    content: "";
    position: absolute;
    right: -9px;
    top: 34px;
    width: 16px;
    height: 16px;
    background: linear-gradient(145deg, #241010, #2b0000);
    border-right: 1.5px solid #ffcc00;
    border-top: 1.5px solid #ffcc00;
    transform: rotate(45deg);
  }

  .reactor {
    position: absolute;
    top: -30px;
    left: -30px;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle, #baf7ff 0%, #29a9e0 40%, transparent 70%);
    opacity: 0.5;
    filter: blur(2px);
    pointer-events: none;
  }

  .title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13.5px;
    font-weight: 700;
    color: #ffcc00;
    letter-spacing: 0.5px;
    -webkit-app-region: no-drag;
  }

  .title .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ff2b2b;
    box-shadow: 0 0 8px #ff2b2b;
  }

  .message {
    font-size: 12px;
    line-height: 1.4;
    color: #eaeaea;
    margin-top: 6px;
    -webkit-app-region: no-drag;
  }

  .message b { color: #ffcc00; }

  .actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    -webkit-app-region: no-drag;
  }

  button {
    flex: 1;
    padding: 7px 8px;
    border-radius: 8px;
    border: none;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.15s ease;
    -webkit-app-region: no-drag;
  }

  button:active { transform: scale(0.96); }

  .drank {
    background: linear-gradient(90deg, #ff3b3b, #b30000);
    color: #ffffff;
  }

  .drank:hover { opacity: 0.9; }

  .snooze {
    background: transparent;
    border: 1px solid #666;
    color: #cccccc;
  }

  .snooze:hover {
    border-color: #ffcc00;
    color: #ffcc00;
  }
</style>
</head>

<body>
  <div class="widget-wrapper">

    <img class="hero-image" src="./assets/ironmain.png" alt="Iron Man">

    <div class="card">
      <div class="reactor"></div>

      <div>
        <div class="title">
          <span class="dot"></span>
          IRON MAN
        </div>

        <div class="message">
          <b>Miss,</b> your hydration levels are suboptimal.<br>
          Arc reactor's fine — you are not. Drink some water. 💧
        </div>
      </div>

      <div class="actions">
        <button class="drank" id="drankBtn">💧 I DRANK</button>
        <button class="snooze" id="snoozeBtn">⏳ Snooze 5m</button>
      </div>
    </div>

  </div>

  <script>
    document.getElementById('drankBtn').addEventListener('click', () => {
      window.hydration.drank();
    });

    document.getElementById('snoozeBtn').addEventListener('click', () => {
      window.hydration.snooze();
    });
  </script>
</body>
</html>
