<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: 'Segoe UI', Roboto, sans-serif;
  }
  body { -webkit-app-region: drag; }

  .panel {
    position: absolute;
    inset: 10px;
    border-radius: 16px;
    background: linear-gradient(160deg, #04181f 0%, #020a0e 60%, #01070a 100%);
    border: 1.5px solid rgba(165, 243, 252, .45);
    box-shadow: 0 0 24px rgba(34, 211, 238, .35), inset 0 0 18px rgba(34, 211, 238, .08);
    color: #d8f6ff;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    -webkit-app-region: no-drag;
  }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    -webkit-app-region: drag;
  }
  .panel-title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .14em;
    color: #8beafd;
    text-transform: uppercase;
  }
  .close-btn {
    -webkit-app-region: no-drag;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid rgba(165, 243, 252, .35);
    background: transparent;
    color: #a5f3fc;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .close-btn:hover { background: rgba(255, 90, 42, .18); border-color: #ff8258; color: #ff8258; }

  .field-label {
    margin-top: 22px;
    font-size: 12px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #7fa3ad;
  }

  .value-row {
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    -webkit-app-region: no-drag;
  }
  .value-display {
    flex: 1;
    text-align: center;
    font-size: 26px;
    font-weight: 700;
    color: #8beafd;
    background: rgba(34, 211, 238, .08);
    border: 1px solid rgba(56, 201, 228, .4);
    border-radius: 10px;
    padding: 10px 0;
  }
  .plus-btn {
    width: 52px;
    height: 48px;
    border-radius: 10px;
    border: 1px solid #a5f3fc;
    background: linear-gradient(180deg, #6eeeff 0%, #12bfe4 100%);
    color: #04222b;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
  }
  .plus-btn:active { transform: scale(.96); }

  .save-btn {
    margin-top: 24px;
    height: 46px;
    border-radius: 10px;
    border: 1px solid #a5f3fc;
    background: linear-gradient(180deg, #6eeeff 0%, #12bfe4 100%);
    color: #04222b;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .save-btn:active { transform: scale(.98); }

  .saved-note {
    margin-top: 8px;
    text-align: center;
    font-size: 11.5px;
    color: #7fe6b0;
    opacity: 0;
    transition: opacity .2s ease;
  }
  .saved-note.show { opacity: 1; }
</style>
</head>
<body>
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title">Settings</div>
      <button class="close-btn" id="closeBtn" type="button" aria-label="Close">✕</button>
    </div>

    <div class="field-label">Reminder after</div>
    <div class="value-row">
      <div class="value-display" id="valueDisplay">30 min</div>
      <button class="plus-btn" id="plusBtn" type="button">+5</button>
    </div>

    <button class="save-btn" id="saveBtn" type="button">Save</button>
    <div class="saved-note" id="savedNote">Saved</div>
  </div>

  <script>
    const MIN = 5;
    const MAX = 60; 
    let minutes = 30;

    const valueDisplay = document.getElementById('valueDisplay');
    const savedNote = document.getElementById('savedNote');

    function render() {
      valueDisplay.textContent = minutes + ' min';
    }

    window.hydration.getSettings().then((s) => {
      if (s && typeof s.reminderMinutes === 'number') {
        minutes = s.reminderMinutes;
        render();
      }
    });

    document.getElementById('plusBtn').addEventListener('click', () => {
      minutes = minutes >= MAX ? MIN : minutes + 5;
      render();
      savedNote.classList.remove('show');
    });

    document.getElementById('saveBtn').addEventListener('click', () => {
      window.hydration.saveSettings(minutes).then(() => {
        window.hydration.closeSettings();
      });
    });

    document.getElementById('closeBtn').addEventListener('click', () => {
      window.hydration.closeSettings();
    });
  </script>
</body>
</html>
